<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Can It Ford? pipeline overview</title>
<desc>Pipeline: video frames to Gaussian splat reconstruction to MPM particle seeding by surface sampling and column fill, to a kks32 mpm-engine simulation, to a ford or no-ford verdict. Below the main pipeline, three abstraction levels L0, L1 and L2 feed into the verdict node.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g font-family="Helvetica, Arial, sans-serif">

<rect x="30" y="44" width="104" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="82" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">Video</text>
<text x="82" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">real flood footage</text>

<line x1="134" y1="74" x2="158" y2="74" marker-end="url(#arrow)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<rect x="158" y="44" width="116" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
<text x="216" y="65" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60,52,137)">gsplat</text>
<text x="216" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83,74,183)">3D Gaussian splat</text>
<text x="216" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83,74,183)">LS6 A100s</text>

<line x1="274" y1="74" x2="298" y2="74" marker-end="url(#arrow)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<rect x="298" y="44" width="116" height="60" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.5"/>
<text x="356" y="65" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8,80,65)">MPM seeding</text>
<text x="356" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15,110,86)">60k surface sample</text>
<text x="356" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15,110,86)">column fill</text>

<line x1="414" y1="74" x2="438" y2="74" marker-end="url(#arrow)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<rect x="438" y="44" width="116" height="60" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="0.5"/>
<text x="496" y="65" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="rgb(12,68,124)">kks32/mpm-engine</text>
<text x="496" y="83" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(24,95,165)">MPM water + rigid</text>
<text x="496" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24,95,165)">Vista GH200s</text>

<line x1="554" y1="74" x2="578" y2="74" marker-end="url(#arrow)" fill="none" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<rect x="578" y="44" width="72" height="60" rx="8" fill="rgb(250,236,231)" stroke="rgb(153,60,29)" stroke-width="0.5"/>
<text x="614" y="65" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113,43,19)">Verdict</text>
<text x="614" y="83" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153,60,29)">FORD /</text>
<text x="614" y="97" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153,60,29)">NO-FORD</text>

<line x1="30" y1="158" x2="610" y2="158" fill="none" stroke="rgb(200,199,196)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(82,81,78)">abstraction ladder</text>

<rect x="46" y="176" width="176" height="68" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
<text x="134" y="197" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(68,68,65)">L0 depth threshold</text>
<text x="134" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">NWS: d &gt; 0.15 m</text>
<text x="134" y="231" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(95,94,90)">= NO-FORD</text>

<rect x="252" y="176" width="176" height="68" rx="8" fill="rgb(250,238,218)" stroke="rgb(133,79,11)" stroke-width="0.5"/>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(99,56,6)">L1 AR&amp;R scalar</text>
<text x="340" y="214" text-anchor="middle" dominant-baseline="central" font-size="11" fill="rgb(133,79,11)">d &gt; 0.30 m or D x V &gt; 0.30</text>
<text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="rgb(133,79,11)">= NO-FORD (small passenger)</text>

<rect x="458" y="176" width="176" height="68" rx="8" fill="rgb(230,241,251)" stroke="rgb(24,95,165)" stroke-width="0.5"/>
<text x="546" y="197" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="rgb(12,68,124)">L2 kks32/mpm-engine</text>
<text x="546" y="215" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24,95,165)">lateral drift &gt; 0.05 m</text>
<text x="546" y="231" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(24,95,165)">no verified verdict yet</text>

<path d="M134 244 L134 302 L614 302 L614 104" fill="none" stroke="rgb(136,135,128)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M340 244 L340 302" fill="none" stroke="rgb(136,135,128)" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M546 244 L546 302" fill="none" stroke="rgb(136,135,128)" stroke-width="1" stroke-dasharray="4 4"/>

</g>
</svg>
