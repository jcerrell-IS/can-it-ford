 border-bottom-color: var(--color-accent-hover); }\n    code { font-family: var(--font-mono); font-size: 0.92em; background: var(--color-surface-raised); padding: 1px 4px; border-radius: 3px; }\n  <\u002Fstyle>\n  \n<\u002Fhelmet>\n\n<div style=\"max-width: 1100px; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-8);\">\n\n  <header style=\"display: flex; flex-direction: column; gap: var(--space-3); border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-5);\">\n    <span style=\"font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted);\">Can It Ford? · research methods · NSF SCIPE REU 2026<\u002Fspan>\n    <h1 style=\"margin: 0; font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: var(--leading-tight); font-weight: var(--weight-semibold); letter-spacing: -0.02em; text-wrap: pretty;\">Every serious failure in this project was silent.<\u002Fh1>\n    <p style=\"margin: 0; max-width: 68ch; font-size: var(--text-lg); line-height: var(--leading-relaxed); color: var(--color-text-muted); text-wrap: pretty;\">Nothing crashed. Exit code zero. Plausible numbers. Figures that rendered. Thirty-three failures are in the full catalogue; these ten are the ones that teach something, and the pattern connecting them is the finding.<\u002Fp>\n  <\u002Fheader>\n\n  <section style=\"margin-top: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--space-4);\">\n    <sc-for list=\"{{ headline }}\" as=\"h\" hint-placeholder-count=\"4\">\n      <div style=\"padding: var(--space-5); border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface);\">\n        <div style=\"font-family: var(--font-mono); font-size: var(--text-3xl); font-weight: var(--weight-semibold); letter-spacing: -0.02em; color: var(--color-accent);\">{{ h.n }}<\u002Fdiv>\n        <div style=\"font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-2); line-height: var(--leading-normal);\">{{ h.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <p style=\"margin: var(--space-5) 0 0; padding: var(--space-5); border-left: 3px solid var(--color-accent); background: var(--color-surface); font-size: var(--text-lg); line-height: var(--leading-relaxed); max-width: 82ch; text-wrap: pretty;\"><strong>The rule that produced all of this:<\u002Fstrong> agreement between two checks is not verification. This project learned it the hard way, when a data file and a verification script both reported the same number for two entirely different wrong reasons — and did not even agree on which cells they were counting.<\u002Fp>\n\n  <section style=\"margin-top: var(--space-7);\">\n    <div style=\"display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5);\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.style }}\" style-hover=\"border-color: var(--color-accent-border);\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: var(--space-4);\">\n      <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <article style=\"{{ c.cardStyle }}\">\n          <button sc-camel-on-click=\"{{ c.toggle }}\" style=\"width: 100%; text-align: left; background: none; border: none; padding: var(--space-5); cursor: pointer; font-family: var(--font-sans); color: var(--color-text); display: flex; flex-direction: column; gap: var(--space-3);\">\n            <div style=\"display: flex; gap: var(--space-3); align-items: flex-start; justify-content: space-between;\">\n              <div style=\"display: flex; gap: var(--space-3); align-items: baseline; min-width: 0;\">\n                <span style=\"font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-text-muted); flex: 0 0 auto;\">{{ c.num }}<\u002Fspan>\n                <h3 style=\"margin: 0; font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: var(--leading-tight); letter-spacing: -0.01em; text-wrap: pretty;\">{{ c.title }}<\u002Fh3>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: var(--space-2); align-items: center; flex: 0 0 auto;\">\n                <x-import component-from-global-scope=\"JosieDesignSystem.Badge\" tone=\"{{ c.tone }}\" hint-size=\"auto,24px\">{{ c.tag }}<\u002Fx-import>\n                <span style=\"font-family: var(--font-mono); color: var(--color-text-muted); font-size: var(--text-sm);\">{{ c.chev }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: var(--text-base); color: var(--color-text-muted); line-height: var(--leading-relaxed); text-wrap: pretty;\">{{ c.summary }}<\u002Fp>\n          <\u002Fbutton>\n          <sc-if value=\"{{ c.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 0 var(--space-5) var(--space-5); display: flex; flex-direction: column; gap: var(--space-4);\">\n              <div style=\"height: 1px; background: var(--color-border);\"><\u002Fdiv>\n              <div>\n                <div style=\"font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin-bottom: var(--space-2);\">What happened<\u002Fdiv>\n                <p style=\"margin: 0; font-size: var(--text-base); line-height: var(--leading-relaxed); text-wrap: pretty;\">{{ c.what }}<\u002Fp>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-success); margin-bottom: var(--space-2);\">How it was caught<\u002Fdiv>\n                <p style=\"margin: 0; font-size: var(--text-base); line-height: var(--leading-relaxed); text-wrap: pretty;\">{{ c.caught }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding: var(--space-4); background: var(--color-accent-subtle); border-radius: var(--radius-md); border: 1px solid var(--color-accent-border);\">\n                <div style=\"font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-text-muted); margin-bottom: var(--space-2);\">Lesson<\u002Fdiv>\n                <p style=\"margin: 0; font-size: var(--text-base); line-height: var(--leading-relaxed); font-weight: var(--weight-medium); text-wrap: pretty;\">{{ c.lesson }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top: var(--space-7); padding: var(--space-6); background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-lg);\">\n    <h2 style=\"margin: 0 0 var(--space-3); font-size: var(--text-2xl); font-weight: var(--weight-semibold); letter-spacing: -0.01em;\">The pattern<\u002Fh2>\n    <p style=\"margin: 0 0 var(--space-5); max-width: 78ch; font-size: var(--text-base); line-height: var(--leading-relaxed); color: var(--color-text-muted); text-wrap: pretty;\">Sorted by what they have in common rather than by when they happened, the eight collapse into three failure classes. Each one defeats a different intuition about what counts as evidence.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: var(--space-5);\">\n      <sc-for list=\"{{ classes }}\" as=\"k\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"font-family: var(--font-mono); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-accent); margin-bottom: var(--space-2);\">{{ k.name }}<\u002Fdiv>\n          <p style=\"margin: 0 0 var(--space-3); font-size: var(--text-sm); line-height: var(--leading-relaxed); text-wrap: pretty;\">{{ k.body }}<\u002Fp>\n          <div style=\"font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted);\">{{ k.members }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"margin-top: var(--space-7);\">\n    <h2 style=\"margin: 0 0 var(--space-2); font-size: var(--text-2xl); font-weight: var(--weight-semibold); letter-spacing: -0.01em;\">What replaced trust<\u002Fh2>\n    <p style=\"margin: 0 0 var(--space-5); max-width: 74ch; font-size: var(--text-base); color: var(--color-text-muted); line-height: var(--leading-relaxed); text-wrap: pretty;\">After the sixth silent failure, checking stopped being something done at the end. These are the instruments the project now runs against itself.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: var(--space-4);\">\n      <sc-for list=\"{{ instruments }}\" as=\"i\" hint-placeholder-count=\"6\">\n        <div style=\"padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface);\">\n          <div style=\"font-family: var(--font-mono); font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-2);\">{{ i.name }}<\u002Fdiv>\n          <p style=\"margin: 0; font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-relaxed); text-wrap: pretty;\">{{ i.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"margin-top: var(--space-7); padding-top: var(--space-5); border-top: 1px solid var(--color-border); font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-relaxed);\">\n    <p style=\"margin: 0 0 var(--space-3);\">Every failure above was recorded in the project's own audit trail at the time it was found, not reconstructed afterwards. The catalogue exists because the independent audit that produced it was instructed to trust nothing from the previous session and to refute rather than confirm — twelve agents, three of them hostile reviewers. It found 21 conclusion-changing contradictions in this project's own prior output, four of which were still live on a poster draft.<\u002Fp>\n    <p style=\"margin: 0;\">Josie Cerrell · Claremont McKenna College · GeoElements Lab, UT Austin · <a href=\"https://github.com/jcerrell-IS/can-it-ford\">github.com/jcerrell-IS/can-it-ford<\u002Fa><\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;expandAll&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Display&quot; }\n}\">\nconst FAILURES = [\n  {\n    num: \"01\", tag: \"geometry\", cls: \"vacuous\",\n    title: \"The solidifier hollowed the vehicle out, and the job exited zero\",\n    summary: \"Sixty rows of a parameter sweep, no stderr, every liveness signal green, every row unusable.\",\n    what: \"The column-fill solidifier fills each (x,y) column from its lowest to its highest occupied z cell. The vehicle source was a surface-only mesh with no faces. At coarse resolution a column was wide enough to catch both a roof point and an underbody point, so it spanned the body and looked solid. At finer resolution most columns caught only one surface point and filled exactly one cell. The solid degenerated into a shell \\u2014 a hollow car, which floats.\",\n    caught: \"A density-plausibility check that 0 of 60 rows passed, plus a scaling-exponent diagnostic: particle count scaled 4.31\\u00d7 where a genuine solid requires 8\\u00d7. That is area scaling, not volume scaling \\u2014 the signature of a surface.\",\n    lesson: \"Exit status is a statement about the process, not about the science.\"\n  },\n  {\n    num: \"02\", tag: \"validation\", cls: \"vacuous\",\n    title: \"The mass-conservation check that could not fail\",\n    summary: \"It compared an expression against itself. Every possible input passed, with an error of 5.68e-16.\",\n    what: \"The audit script computed particle mass as density \\u00d7 volume / particle count, summed it over the particle count, and compared the result against density \\u00d7 volume. Both sides are the identical expression. The residual was pure floating-point roundoff for every conceivable input. The simulation output was loaded and then never used.\",\n    caught: \"Proved by construction rather than by inspection: replacing every particle position with 999.0 and every velocity with 12345.0 produced an identical PASS.\",\n    lesson: \"A validator that cannot fail carries zero information, and is worse than no validator because it launders confidence. The test is to feed it deliberate garbage. This pattern recurred three times here \\u2014 it is a class, not an incident.\"\n  },\n  {\n    num: \"03\", tag: \"validation\", cls: \"circular\",\n    title: \"The guardrail was calibrated on the bug it was meant to catch\",\n    summary: \"For weeks, a plausibility check passed the defective geometry and would have flagged the correct one.\",\n    what: \"The project asserted a 100\\u2013300 kg/m\\u00b3 band for effective vehicle density. That band was only ever satisfied because the broken column-fill solidifier over-filled the body by 2.17\\u00d7, diluting realized density to 142.9 kg/m\\u00b3 \\u2014 comfortably inside it. When the geometry was fixed, fill ratio became 1.0023 and density became 309.75, outside the project's own acceptance band.\",\n    caught: \"Noticed only because the fix failed the check. The band was derived from the observed output of a buggy pipeline, so it had certified the bug and now rejected the correction.\",\n    lesson: \"When a correction pushes you outside your own acceptance band, suspect the band. A threshold inferred from observed output inherits every defect in the thing that produced it.\"\n  },\n  {\n    num: \"04\", tag: \"numerics\", cls: \"boundary\",\n    title: \"Floating point flipped verdicts on a published threshold\",\n    summary: \"0.1 \\u00d7 3.0 is 0.30000000000000004, which is strictly greater than a 0.30 cap. Four cells reported the wrong answer, with no error.\",\n    what: \"The AR&R criterion was transcribed from the source report as an equality boundary. Scenarios sitting exactly on the published cap were therefore classified NO-FORD by a margin of 1e-17. Four of seventy cells were affected. Separately, the stored requested depth of 0.30000001192092896 exceeded the same cap by 1.2e-8 m, so any evaluation using requested rather than realized depth tripped the depth cap on a floating-point artifact rather than on physics.\",\n    caught: \"Found by recomputing the sweep independently and diffing cell by cell, rather than by reading the code. The fix is a rounding tolerance before the comparison \\u2014 and at the time it was found, it was sitting uncommitted, so a clean clone of the repository still produced four wrong verdicts and no error.\",\n    lesson: \"A criterion transcribed from a paper as an equality boundary needs an explicit tolerance. And \\u201cfixed in my working copy\\u201d is not fixed.\"\n  },\n  {\n    num: \"05\", tag: \"citation\", cls: \"boundary\",\n    title: \"A verbatim quote attached to the wrong subject\",\n    summary: \"The words were accurate. The thing they described was not.\",\n    what: \"An early draft asserted that the authors of the AR&R criteria called their own stability table \\u201cclearly non-conservative.\\u201d The quote is correct word for word. But the source says it of the pre-2011 guidelines, and the very next sentence offers the table as the revision that fixes them. The draft had inverted the source's argument while quoting it exactly.\",\n    caught: \"An intake audit that read the sentence before and the sentence after every quotation, before the claim reached any deliverable.\",\n    lesson: \"Quoting accurately and attributing accurately are two separate checks. When a quote carries an argument, read its neighbours. The corrected framing turned out to be stronger than the false one \\u2014 what those authors actually asked for was full-scale testing and computational calibration, which is precisely what this work supplies.\"\n  },\n  {\n    num: \"06\", tag: \"reasoning\", cls: \"circular\",\n    title: \"The right fix for the wrong reason\",\n    summary: \"A real bug, correctly fixed, justified by a false premise \\u2014 which means the reasoning would misfire next time.\",\n    what: \"The missing depth cap was a genuine defect and restoring it was correct. The justification given was that the source's 0.30 figure is a still-water depth limit rather than a D\\u00d7V product. The source states both: they are two separate criteria that happen to coincide numerically for the small-passenger class, which is exactly why the confusion was available in the first place.\",\n    caught: \"Re-reading the primary table rather than the note about the primary table, during the citation audit.\",\n    lesson: \"A correct outcome does not validate the reasoning that produced it. Bank the outcome; re-derive the reasoning, or you will misapply it.\"\n  },\n  {\n    num: \"07\", tag: \"tooling\", cls: \"boundary\",\n    title: \"A phantom bug, nearly filed on the PI's own repository\",\n    summary: \"An AI summary conflated two code paths. The bug did not exist.\",\n    what: \"The claim was that the MPM engine silently ignores friction for one surface type. Reading the actual source shows the friction block sits at the same indentation as the surface-type branch, so friction is read for both types. The claim originated in a generated summary of the codebase that merged two different control-flow paths. A patch file and a public bug report on the PI's own repository were nearly produced from it.\",\n    caught: \"Reading the source instead of the summary. The instructive detail is where the tool was and was not reliable: it was accurate on a structural, greppable question \\u2014 is X ever assigned from Y \\u2014 and wrong on a control-flow question \\u2014 which branch does this line sit inside \\u2014 because the latter is indentation-dependent.\",\n    lesson: \"Know which questions your tools are reliable on. Structural queries and control-flow queries have different failure rates, and the second class needs the source.\"\n  },\n  {\n    num: \"08\", tag: \"duplication\", cls: \"circular\",\n    title: \"One rule, copied inline into three scripts, silently drifted\",\n    summary: \"Three figure generators each carried their own copy of the criterion, all three applying the loosest class to every row.\",\n    what: \"Three separate figure scripts each inlined the comparison as a bare product against a 0.60 threshold. That is the Large 4WD cap applied to every scenario regardless of class, with the depth cap and velocity cap ignored entirely. It is not a simplification \\u2014 it is the loosest of three published classes applied to all of them. A canonical implementation of the full rule existed in the repository the whole time. A later similarity pass found the same script forked across trees on a single character, less-or-equal against less-than, in files 4267 and 4266 bytes long, which no size-comparison pass could ever see.\",\n    caught: \"A content-similarity pass over the whole repository, and a check that now refuses any script recomputing the criterion inline instead of reading the canonical column.\",\n    lesson: \"A rule duplicated inline in N places is N rules, and they will drift. Any verdict count has to name the rule that produced it, not just the file.\"\n  }\n];\n\nFAILURES.push(\n  {\n    num: \"09\", tag: \"tooling\", cls: \"circular\",\n    title: \"The novelty guard silenced itself, because recording the problem satisfied it\",\n    summary: \"A check existed specifically to catch uncited prior art. Writing the prior art down is what made it report \\u201ccited.\\u201d\",\n    what: \"A tool was built after four vehicle-fording papers were found sitting uncited in the project's own catalogues while the project prepared to claim nobody had simulated fording. Its docstring names that purpose explicitly. But it answered the question \\u201cdoes this DOI appear anywhere under docs/, paper/ or CLAUDE.md\\u201d \\u2014 and the sessions that discovered the gap wrote those DOIs into exactly those places. The gate then reported all four as cited. It also searched the .bib and treated a hit there as a citation, and it never opened the canonical paper source at all, because that file lives on a remote and not in the working tree.\",\n    caught: \"By reading the tool's source rather than trusting its output, then testing it against the four DOIs it was built to catch. All four returned \\u201ccited\\u201d; none appears in any .tex. Independently, a census of the shipped bibliography found zero of fifteen catalogued vehicle-in-water simulations reach the reference list \\u2014 the one with an entry is the one entry nothing cites, so BibTeX drops it.\",\n    lesson: \"The root error is substituting \\u201cdoes this string appear in the repository\\u201d for \\u201cdoes this work appear in the reference list.\\u201d Four states must be named separately, because three of them print nothing: mentioned, in the bibliography, cited, and in the reference list. The same substitution happened twice in one night by two independent routes \\u2014 a Python function and a hand classification \\u2014 which makes it a finding about method, not two numbers.\"\n  },\n  {\n    num: \"10\", tag: \"citation\", cls: \"boundary\",\n    title: \"A real identifier carrying an invented title \\u2014 on the PI's own paper\",\n    summary: \"The DOI resolved perfectly. The title attached to it was not the title of that work. Following the link could never catch it.\",\n    what: \"A bibliography entry claimed \\u201cNeRF-to-MPM Inversion for Granular Material Property Estimation.\\u201d The identifier is real and resolves cleanly \\u2014 to a paper actually titled \\u201cFrom images to properties: a NeRF-driven framework for granular material parameter inversion,\\u201d published in EPJ Web of Conferences, not a preprint. Title similarity 0.713. This is the dominant machine-fabrication pattern: a genuine resolvable identifier paired with a title reconstructed from a memory of what the paper is about. The work is by the project's own PI and a daily mentor.\",\n    caught: \"By comparing every claimed title against the record its identifier actually resolves to, across all 18 works \\u2014 not by clicking the links, which all worked. Two of eighteen mismatched. The worse detail: two copies of this entry existed and were wrong in opposite directions \\u2014 one had the right title and the wrong venue, the other the wrong title and no venue \\u2014 so reconciling them by picking a winner produces a wrong entry either way. Only assembling from the resolved record is correct.\",\n    lesson: \"\\u201cThe DOI works\\u201d is not verification. Only comparing the claimed title against the resolved record catches an invented title on a real identifier. And when two sources disagree, neither can be used to correct the other \\u2014 go back to the primary.\"\n  }\n);\n\nconst CLASSES = [\n  { name: \"Vacuously true\", body: \"The check ran, passed, and could not have done otherwise. Both sides of a comparison were the same expression; a plausibility band was fitted to broken output. Passing carried no information at all.\", members: \"Failures 01, 02\" },\n  { name: \"Circular\", body: \"The evidence was downstream of the thing it was meant to test. A band derived from a bug certifies the bug; a rule copied from a figure script validates the figure script; a novelty guard is satisfied by the act of recording the gap it exists to find.\", members: \"Failures 03, 06, 08, 09\" },\n  { name: \"Boundary and provenance\", body: \"The number was right and its context was wrong. An equality transcribed without tolerance, a quote severed from its subject, a summary substituted for source, a real identifier wearing an invented title.\", members: \"Failures 04, 05, 07, 10\" }\n];\n\nconst INSTRUMENTS = [\n  { name: \"Garbage-input testing\", body: \"Every validator is fed deliberately corrupted state. If it still passes, it is deleted rather than trusted.\" },\n  { name: \"Adversarial review\", body: \"Reviewers instructed to refute rather than confirm, reading live files and never restating a number from a summary without opening the primary source.\" },\n  { name: \"Canonical single source\", body: \"An automated check refuses any script that recomputes a threshold inline instead of reading the one authoritative implementation.\" },\n  { name: \"Barred-claims register\", body: \"A standing list of sentences that must never be written, each with the evidence that retired it \\u2014 including superseded figures from this project's own earlier drafts.\" },\n  { name: \"Quantity-and-unit audit\", body: \"Constants are traced not just to a source but to the quantity that source actually measured. Three gating constants failed on exactly this and were reclassified as project conventions.\" },\n  { name: \"Volunteer the limit\", body: \"Every claim carries the clause that bounds it, stated before anyone asks. Quote the sign when the magnitude will not survive refinement.\" }\n];\n\nconst HEADLINE = [\n  { n: \"33\", label: \"failures in the full catalogue\" },\n  { n: \"0\", label: \"of them raised a non-zero exit code\" },\n  { n: \"21\", label: \"conclusion-changing contradictions found by adversarial re-audit\" },\n  { n: \"7\", label: \"values believed for one density, in nineteen days\" }\n];\n\nconst FILTERS = [\n  { key: \"all\", label: \"All ten\" },\n  { key: \"vacuous\", label: \"Vacuously true\" },\n  { key: \"circular\", label: \"Circular\" },\n  { key: \"boundary\", label: \"Boundary & provenance\" }\n];\n\nconst TAG_TONE = {\n  geometry: \"accent\",\n  validation: \"danger\",\n  numerics: \"warning\",\n  citation: \"neutral\",\n  reasoning: \"neutral\",\n  tooling: \"warning\",\n  duplication: \"accent\"\n};\n\nclass Component extends DCLogic {\n  state = { open: {}, filter: \"all\" };\n\n  renderVals() {\n    const { open, filter } = this.state;\n    const expandAll = this.props.expandAll ?? false;\n    const visible = FAILURES.filter(f => filter === \"all\" || f.cls === filter);\n\n    return {\n      headline: HEADLINE,\n      classes: CLASSES,\n      instruments: INSTRUMENTS,\n      filters: FILTERS.map(f => ({\n        label: f.label,\n        pick: () => this.setState({ filter: f.key }),\n        style: [\n          \"padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);cursor:pointer\",\n          \"font-family:var(--font-sans);font-size:var(--text-sm);font-weight:var(--weight-medium)\",\n          f.key === filter\n            ? \"background:var(--color-accent);color:var(--color-text-inverse);border:1px solid var(--color-accent)\"\n            : \"background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border)\"\n        ].join(\";\")\n      })),\n      cards: visible.map(f => {\n        const isOpen = expandAll || !!open[f.num];\n        return {\n          ...f,\n          tone: TAG_TONE[f.tag] || \"neutral\",\n          open: isOpen,\n          chev: isOpen ? \"\\u2212\" : \"+\",\n          toggle: () => this.setState(s => ({ open: { ...s.open, [f.num]: !s.open[f.num] } })),\n          cardStyle: [\n            \"border-radius:var(--radius-lg);background:var(--color-surface);overflow:hidden\",\n            isOpen ? \"border:1px solid var(--color-accent-border)\" : \"border:1px solid var(--color-border)\"\n          ].join(\";\")\n        };\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
