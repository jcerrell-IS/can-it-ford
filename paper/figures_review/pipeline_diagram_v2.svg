<text x="491.0" y="281.45" text-anchor="middle" font-family="DejaVu Serif, Times New Roman, Times, serif" font-size="27" fill="#000000">(gsplat, LS6)</text>
<line x1="638" y1="255.0" x2="659" y2="255.0" stroke="#000000" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="666" y="119" width="280" height="272" rx="18" fill="#F4F4F4" stroke="#000000" stroke-width="3" stroke-dasharray="14 10"/>
<text x="806.0" y="213.45" text-anchor="middle" font-family="DejaVu Serif, Times New Roman, Times, serif" font-size="27" fill="#000000">PhysGaussian</text>
