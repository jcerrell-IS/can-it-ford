<text x="176.0" y="264.45" text-anchor="middle" font-family="DejaVu Serif, Times New Roman, Times, serif" font-size="27" fill="#000000">(flooded / water-</text>
<text x="176.0" y="298.45" text-anchor="middle" font-family="DejaVu Serif, Times New Roman, Times, serif" font-size="27" fill="#000000">adjacent scene)</text>
