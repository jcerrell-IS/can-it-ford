<svg xmlns="http://www.w3.org/2000/svg" width="1613" height="512" viewBox="0 0 1613 512" role="img">
<title>Can It Ford? reconstruct-to-decide pipeline</title>
<desc>Five-stage pipeline. The Gaussian Splat and PhysGaussian Bridge stages are drawn with dashed borders to mark them as conceptual, not part of the path used for the reported results.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#000"/></marker></defs>
